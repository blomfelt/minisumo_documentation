name: Create zip for each variant on tag

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build release zip-files 
        # Places zip files of the form variantName-${VERSION}.zip in release/
        run: ./release_variants.sh

      - name: Release the zip-files
        uses: softprops/action-gh-release@v3
        with:
          working_directory: release
          files: |
            *.zip
